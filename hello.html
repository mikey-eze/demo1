
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniShop</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 22px;
    }

    #cartBtn {
      background: white;
      color: #111;
      border: 0;
      padding: 9px 15px;
      border-radius: 20px;
      cursor: pointer;
    }

    .hero {
      text-align: center;
      padding: 45px 20px;
    }

    .hero h2 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #666;
    }

    .search {
      display: block;
      width: 85%;
      max-width: 500px;
      margin: 0 auto 30px;
      padding: 13px 16px;
      border: 1px solid #ddd;
      border-radius: 25px;
      outline: none;
    }

    .products {
      width: 86%;
      max-width: 1100px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      padding-bottom: 50px;
    }

    .product {
      background: white;
      border-radius: 15px;
      padding: 15px;
      box-shadow: 0 5px 20px #0000000d;
    }

    .product img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 10px;
    }

    .product h3 {
      margin: 12px 0 5px;
    }

    .price {
      color: #555;
      margin-bottom: 12px;
    }

    .add {
      width: 100%;
      padding: 11px;
      border: 0;
      background: #111;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }

    .add:hover {
      background: #333;
    }

    #cart {
      position: fixed;
      right: -400px;
      top: 0;
      width: 350px;
      max-width: 90%;
      height: 100%;
      background: white;
      z-index: 10;
      padding: 25px;
      box-shadow: -5px 0 20px #0002;
      transition: .3s;
      overflow-y: auto;
    }

    #cart.open {
      right: 0;
    }

    .cart-head {
      display: flex;
      justify-content: space-between;
      margin-bottom: 25px;
    }

    .close {
      border: 0;
      background: none;
      font-size: 24px;
      cursor: pointer;
    }

    .cart-item {
      border-bottom: 1px solid #eee;
      padding: 12px 0;
    }

    .cart-item button {
      margin: 8px 4px 0 0;
      padding: 4px 9px;
      border: 1px solid #ddd;
      background: white;
      border-radius: 5px;
      cursor: pointer;
    }

    .total {
      font-size: 20px;
      font-weight: bold;
      margin: 25px 0;
    }

    .checkout {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #111;
      color: white;
      cursor: pointer;
    }

    @media(max-width:500px) {
      .hero h2 {
        font-size: 26px;
      }

      .product img {
        height: 180px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>MiniShop</h1>
  <button id="cartBtn" onclick="toggleCart()">
    🛒 Cart (<span id="count">0</span>)
  </button>
</header>

<section class="hero">
  <h2>Simple. Clean. Shopping.</h2>
  <p>Find something you like.</p>
</section>

<input
  class="search"
  id="search"
  placeholder="Search products..."
  oninput="searchProducts()"
>

<section class="products" id="products"></section>

<div id="cart">
  <div class="cart-head">
    <h2>Your Cart</h2>
    <button class="close" onclick="toggleCart()">×</button>
  </div>

  <div id="cartItems"></div>

  <div class="total">
    Total: ₹<span id="total">0</span>
  </div>

  <button class="checkout" onclick="checkout()">
    Checkout
  </button>
</div>

<script>
const products = [
  {
    id: 1,
    name: "Classic T-Shirt",
    price: 499,
    image: "https://picsum.photos/500/500?random=1"
  },
  {
    id: 2,
    name: "Sneakers",
    price: 1499,
    image: "https://picsum.photos/500/500?random=2"
  },
  {
    id: 3,
    name: "Headphones",
    price: 999,
    image: "https://picsum.photos/500/500?random=3"
  },
  {
    id: 4,
    name: "Backpack",
    price: 799,
    image: "https://picsum.photos/500/500?random=4"
  }
];

let cart = [];

function displayProducts(list = products) {
  const container = document.getElementById("products");

  container.innerHTML = list.map(product => `
    <div class="product">
      <img src="${product.image}" alt="${product.name}">
      <h3>${product.name}</h3>
      <p class="price">₹${product.price}</p>
      <button class="add" onclick="addToCart(${product.id})">
        Add to Cart
      </button>
    </div>
  `).join("");
}

function addToCart(id) {
  const item = cart.find(item => item.id === id);

  if (item) {
    item.quantity++;
  } else {
    const product = products.find(product => product.id === id);
    cart.push({...product, quantity: 1});
  }

  updateCart();
}

function changeQuantity(id, amount) {
  const item = cart.find(item => item.id === id);

  if (!item) return;

  item.quantity += amount;

  if (item.quantity <= 0) {
    cart = cart.filter(item => item.id !== id);
  }

  updateCart();
}

function updateCart() {
  const container = document.getElementById("cartItems");

  container.innerHTML = cart.length
    ? cart.map(item => `
      <div class="cart-item">
        <strong>${item.name}</strong>
        <p>₹${item.price} × ${item.quantity}</p>

        <button onclick="changeQuantity(${item.id}, -1)">−</button>
        <button onclick="changeQuantity(${item.id}, 1)">+</button>
      </div>
    `).join("")
    : "<p>Your cart is empty.</p>";

  const total = cart.reduce(
    (sum, item) => sum + item.price * item.quantity,
    0
  );

  const count = cart.reduce(
    (sum, item) => sum + item.quantity,
    0
  );

  document.getElementById("total").textContent = total;
  document.getElementById("count").textContent = count;
}

function toggleCart() {
  document.getElementById("cart").classList.toggle("open");
}

function searchProducts() {
  const query = document
    .getElementById("search")
    .value
    .toLowerCase();

  const filtered = products.filter(product =>
    product.name.toLowerCase().includes(query)
  );

  displayProducts(filtered);
}

function checkout() {
  if (cart.length === 0) {
    alert("Your cart is empty!");
    return;
  }

  alert("Order placed successfully!");
  cart = [];
  updateCart();
  toggleCart();
}

displayProducts();
updateCart();
</script>

</body>
</html>
